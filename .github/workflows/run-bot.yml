name: X Bot Automation

on:
  schedule:
    # Run every 6 hours during active window
    - cron: '0 */6 * * *'

  # Allow manual trigger
  workflow_dispatch:

jobs:
  run-bot:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Install Playwright browsers
        run: |
          playwright install chromium
          playwright install-deps

      - name: Restore session & data
        uses: actions/cache@v4
        with:
          path: |
            data/
            session.json
          key: bot-session-${{ github.run_number }}
          restore-keys: |
            bot-session-

      - name: Decode session cookies
        env:
          SESSION_JSON_B64: ${{ secrets.SESSION_JSON_B64 }}
        run: |
          if [ -n "$SESSION_JSON_B64" ]; then
            echo "$SESSION_JSON_B64" | base64 -d > session.json
            echo "✓ Session cookies restored from secret"
          else
            echo "⚠ No SESSION_JSON_B64 secret found"
            echo "  To set up: base64 -w0 session.json | copy to GitHub Secrets"
          fi

      - name: Run bot
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          HEADLESS_MODE: "true"
          ENVIRONMENT: production
        run: |
          timeout 3000 python run_bot.py || true

      - name: Save session & data
        if: always()
        uses: actions/cache/save@v4
        with:
          path: |
            data/
            session.json
          key: bot-session-${{ github.run_number }}
