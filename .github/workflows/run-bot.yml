name: X Bot Automation

on:
  schedule:
    - cron: '0 6,9,12,15,18,21 * * *'
  workflow_dispatch:

jobs:
  run-bot:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          pip install APScheduler        
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Install Playwright browsers
        run: |
          playwright install chromium
          playwright install-deps

      - name: Restore session & data
        uses: actions/cache@v4
        with:
          path: |
            data/
            session.json
          key: bot-session-${{ github.run_number }}
          restore-keys: |
            bot-session-

      - name: Decode session cookies
        env:
          SESSION_JSON_B64: ${{ secrets.SESSION_JSON_B64 }}
        run: |
          if [ -n "$SESSION_JSON_B64" ]; then
            echo "$SESSION_JSON_B64" | base64 -d > session.json
            echo "✓ Session cookies restored from secret"
          else
            echo "⚠ No SESSION_JSON_B64 secret found"
          fi

      - name: Clear stale session state
        run: |
          rm -f data/session_state.txt
          echo "✓ Cleared stale session state"

      - name: Run bot
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          HEADLESS_MODE: "true"
          ENVIRONMENT: production
          SEARCH_KEYWORDS: "AI tools,python automation,making money online,freelance developer,building in public,side project,self taught developer,learn to code"
          CONTENT_PILLARS: "ai:AI tools and automation tips for working smarter not harder,hustle:Making money as a developer through freelancing and side projects,journey:Real talk about growing as a self-taught developer from Uganda"
          VIRAL_HOOKS: "hot_take,question,thread_hook,contrarian,story,tip"
          ACTIVE_START_HOUR: "5"
          ACTIVE_END_HOUR: "20"
          DAILY_TWEET_START_HOUR_UTC: "7"
          DAILY_TWEET_END_HOUR_UTC: "10"
          DAILY_TWEET_ENABLED: "true"
          MAX_LIKES_PER_DAY: "20"
          MAX_REPLIES_PER_DAY: "15"
          MAX_FOLLOWS_PER_DAY: "10"
          MAX_UNFOLLOWS_PER_DAY: "5"
          MAX_POSTS_PER_DAY: "1"
          BANNED_WORDS: "viagra,cialis,pharmacy,mlm,pyramid,dropship"
        run: |
          timeout 3000 python run_bot.py || true

      - name: Save session & data
        if: always()
        uses: actions/cache/save@v4
        with:
          path: |
            data/
            session.json
          key: bot-session-${{ github.run_number }}
